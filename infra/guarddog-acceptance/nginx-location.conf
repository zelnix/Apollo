# Add inside the existing TLS server block for blocktest.btciq.app.
# Preserve the existing root endpoint and certificate configuration.
location = /apollo-guarddog-acceptance/v1 {
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control "no-store" always;
    add_header X-Apollo-Guarddog-Acceptance "v1" always;
    return 200 "APOLLO_GUARDDOG_ACCEPTANCE_V1\n";
}