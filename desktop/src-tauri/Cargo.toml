[package]
name = "apollo-desktop"
version = "1.0.0"
description = "Apollo desktop host (Windows/macOS)"
edition = "2021"

[lib]
name = "apollo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
os_info = "3"
if-addrs = "0.13"
