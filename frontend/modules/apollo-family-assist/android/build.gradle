plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.apollo.familyassist'
version = '1.0.0'
expoModule { canBePublished false }

android {
  namespace 'app.apollo.familyassist'
  defaultConfig { versionCode 1; versionName '1.0.0' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  // WebRTC belongs to Family Help alone: the Jitsi build of WebRTC M124 (Maven Central), the same release the
  // iOS side uses (JitsiWebRTC ~> 124.0.0 in ios/ApolloFamilyAssist.podspec). No app-wide react-native-webrtc.
  implementation 'org.jitsi:webrtc:124.0.0'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  testImplementation 'junit:junit:4.13.2'
}
