// Expo SDK 57 module build. Uses `expo-module-gradle-plugin` (same pattern as the certified
// packages/guarddog-expo-module), which supplies compileSdk/minSdk/targetSdk/Kotlin config from the root
// project and applies the Pika compiler plugin required by Function/AsyncFunction definitions.
// The legacy ExpoModulesCorePlugin.gradle path failed EAS build eb022c0b with
// "project ':apollo-security' does not specify `compileSdk`" (Stage 1C.1).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.hucentai.apollosecurity'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace "com.hucentai.apollosecurity"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions { abortOnError false }
}

dependencies {
  implementation project(':guarddog-core')
  implementation project(':guarddog-vpn')
  implementation 'androidx.core:core-ktx:1.13.1'
  testImplementation 'junit:junit:4.13.2'
}
