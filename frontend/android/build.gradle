// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    gradlePluginPortal() // GuardDog kotlin.serialization plugin (Stage 1C): resolves the kotlin.plugin.serialization marker artifact below
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.4'
        // GuardDog kotlin.serialization plugin (Stage 1C): required by guarddog-core/guarddog-vpn (packages/guarddog-android-sdk), which apply
        // org.jetbrains.kotlin.plugin.serialization without a pinned version and expect it already registered here.
        classpath 'org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin:2.1.20'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
