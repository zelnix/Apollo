name: native-gates
on: [push, pull_request, workflow_dispatch]
# Least privilege: every job only reads the repository; artifacts are uploaded via the actions token.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      # Prebuild so gate steps 5-6 (Expo module inside the generated app, frozen SDK levels 26/36/36) execute, not skip.
      - run: cd frontend && yarn install --frozen-lockfile && CI=1 npx expo prebuild --platform android --clean --no-install
      - run: bash scripts/ci/android-native-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-native-gate, path: docs/evidence }
  # AC-04: development APK + merged-manifest audit on a native x86_64 runner (no device: the script stops before install and
  # uploads guarddog-m1-dev.apk, merged-AndroidManifest.xml, merged-manifest-audit.txt for the physical-device run).
  # Trust boundary: this job consumes PUBLIC distribution data only (GET /api/config, /latest, /keys from GD_BACKEND_URL) and the
  # public key pinned in the SDK. It never receives the Ed25519 signing seed; no backend is started here.
  android-dev-build:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install httpx
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - run: bash scripts/ci/android-dev-build.sh
        env:
          CI: "1"
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.GD_BACKEND_URL }}   # repository variable (public distribution URL), not a secret
          GD_DEV_ABIS: arm64-v8a
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}          # baked into the JS bundle → appears in the device proof report
          EXPO_PUBLIC_CI_RUN_ID: ${{ github.run_id }}
      # Artifact recheck before any phone: intended dev build, 26/36, arm64-v8a only, VpnService facts, no secret/.env content packaged.
      - run: bash scripts/ci/apk-recheck.sh docs/evidence/guarddog-m1-dev.apk
        env: { GD_DEV_ABIS: arm64-v8a }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-dev-build, path: docs/evidence }
  # AC-02: runs the SAME scripts/ci/ios-native-gate.sh as a developer Mac would (SwiftPM resolve/build/tests, cycle check,
  # CocoaPods + xcodebuild of the Expo iOS module inside the prebuilt app) and preserves docs/evidence/ios-native-gate.txt.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: xcodebuild -version && swift --version && pod --version
      # Prebuild iOS so gate step 3 (Expo iOS module linkage via CocoaPods) executes instead of skipping.
      - run: cd frontend && yarn install --frozen-lockfile && CI=1 npx expo prebuild --platform ios --clean --no-install
      - run: bash scripts/ci/ios-native-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-native-gate, path: docs/evidence }
  executable-suites:
    runs-on: ubuntu-latest
    services:
      mongo: { image: "mongo:7", ports: ["27017:27017"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: pip install -r backend/requirements.txt
      - run: cp backend/.env.example backend/.env
      # Ephemeral Ed25519 seeds generated per run: the real gd-m1-test-ed25519-001 seed stays in the controlled signing environment.
      # Tests that need the real key (pinned-key match, byte-identical fixture regeneration) skip via GD_CI_EPHEMERAL_KEY=1;
      # the frozen v25 bundle is verified read-only with the pinned PUBLIC key (tests/test_frozen_bundle_public_verification.py).
      - run: |
          echo "GD_M1_SIGNING_PRIVATE_KEY_B64=$(python -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
          echo "GD_M1_SECONDARY_PRIVATE_KEY_B64=$(python -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - run: cd backend && python -m pytest tests -q --ignore=tests/test_m1_endpoints_integration.py
        env: { GD_CI_EPHEMERAL_KEY: "1", MONGO_URL: mongodb://localhost:27017, DB_NAME: ci, GD_ADMIN_TOKEN: ci-admin, GD_CONTROLLED_HOST: m1-block-test.guarddog.example, GD_CONTROLLED_IPV4: 203.0.113.10, GD_CONTROLLED_URL: https://m1-block-test.guarddog.example/ }
      - run: cd packages/guarddog-contracts && node --test tests/*.test.ts
